{% extends 'base.html' %}
{% block title %}About - ShopEasy{% endblock %}

{% block content %}
<h1>About {{ company_name }}</h1>
<p>Founded in {{ founded_year }}.</p>
<p>{{ about_text }}</p>

<h2>Meet the Team</h2>
<ul>
    {% for member in team_members %}
        <li>{{ member.name }} — {{ member.role }}</li>
    {% endfor %}
</ul>
{% endblock %}
